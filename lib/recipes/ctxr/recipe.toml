# The Contexture CLI, a tool: `npm install -g ctxr-cli` into NPM_CONFIG_PREFIX (~/.local), installed on
# a container's first boot and updated daily like every npm tool. The image carries no ctxr. An
# agent's own `npm install -g ctxr-cli@latest` (the ctxr-upgrade skill's) writes the same place.
#
# Two containers install it, each into its own /home/agent. The agents container's home is the
# agents'. `serve` holds the store's approval App key, so it has a home of its own -- the
# `serve-home` volume, which no agent container mounts -- and its ctxr is the same package at the
# same path where no agent can write it. Both follow the latest release, so serve and the agents
# meet a new store schema within a day of each other.
kind = "tool"
npm = "ctxr-cli"
binaries = ["ctxr"]

# The store's browsing, approval and landing server. Selected only in the serve container.
[services.ctxr-serve]
command = ["ctxr", "serve", "--host", "0.0.0.0", "--port", "${CTXR_SERVE_PORT:-18080}", "--root", "${CONTEXTURE_STORE_ROOT:-/store}"]
directory = "${CONTEXTURE_STORE_ROOT:-/store}"
probe = "http://127.0.0.1:${CTXR_SERVE_PORT:-18080}/"
