# OpenAI's Codex CLI, a harness, from its official standalone installer
# (https://chatgpt.com/codex/install.sh), run as the agent: releases under
# ~/.codex/packages/standalone/releases/, the launcher at ~/.local/bin/codex. Self-updating: installed
# as `latest`, it updates itself and keeps the current and previous releases.
kind = "harness"
self_updating = true
binaries = ["codex"]

# harness-remote insists on the foreground `--no-daemon` form: a background launcher would make a
# dead service look healthy.
[services.codex-remote]
command = ["python3", "/usr/local/bin/harness-remote", "run", "codex"]
environment = { HARNESS_REMOTE_AGENTS = "codex", HARNESS_REMOTE_HOME = "${HOME}" }

[config]
root = ".codex"
rules = "!/sessions/"
