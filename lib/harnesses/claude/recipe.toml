# Claude Code, from its native installer (it is not on npm).
#
# The installer takes an exact version, so this is a real pin. It installs under $HOME/.local, so
# `install` points HOME into the version's own directory -- what install-agent-clis.sh does into
# /opt/toolchain today -- and the agent still runs it with its real HOME. The launcher it writes is
# an absolute symlink into that directory, which is why versions are never moved after install.
#
# Its own auto-updater is off image-wide (DISABLE_AUTOUPDATER=1): harness-install is the one writer
# of /opt/harnesses, so a pin holds and the version on record is the version that runs.
binaries = ["claude"]

[services.claude-remote]
command = ["python3", "/usr/local/bin/harness-remote", "run", "claude"]
environment = { HARNESS_REMOTE_AGENTS = "claude", HARNESS_REMOTE_HOME = "${HOME}" }
