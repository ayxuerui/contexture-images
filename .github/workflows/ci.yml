# Build every harness image without pushing, so the smoke tests baked into each Dockerfile
# (gh --version, `ctxr --version` equals CTXR_VERSION, the WebUI compileall) gate every PR.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The provisioner guards live store content, and its refresh path has now failed twice by
  # doing nothing visible. Runs before the image build because it needs no image -- only git,
  # root, and a few seconds -- so a broken refresh is reported in under a minute rather than
  # after a 45-minute matrix.
  provision:
    name: provision refresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Root and a foreign-owned checkout are the point of the test, not an accident of the
      # environment: the production failure only appears when the store belongs to another uid.
      - name: Run the refresh regression tests
        run: sudo sh lib/tests/provision-refresh-test.sh

  # Same reasoning as the job above, for the other pair of guards that fail silently: an
  # allowlist that stopped ignoring a credential, and an archive verifier that stopped noticing
  # a `hermes backup` with no state.db in it. Both produce a green run and a broken backup.
  backup-guards:
    name: backup guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Root against a foreign-owned repo is the production shape, not an accident of the
      # environment -- the same condition that has broken the provisioner's refresh twice.
      - name: Run the backup guard regression tests
        run: sudo sh lib/tests/harness-config-test.sh

  build:
    name: build (${{ matrix.harness }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One entry today. Adding a harness is adding a directory plus a line here; nothing
        # else in this workflow changes.
        harness: [hermes]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve CTXR_VERSION
        id: ctxr
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < CTXR_VERSION)"
          [ -n "${version}" ] || { echo "::error::CTXR_VERSION is empty"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # amd64 only on PRs. The arm64 leg needs QEMU emulation and roughly triples the build,
      # for a Dockerfile whose failure modes (a moved .deb, a version mismatch, a Python
      # syntax break) are not architecture-specific. release.yml still publishes both.
      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: harnesses/${{ matrix.harness }}/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            CTXR_VERSION=${{ steps.ctxr.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
