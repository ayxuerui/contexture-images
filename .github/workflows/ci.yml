# Build every harness image without pushing, so the smoke tests baked into each Dockerfile
# (gh --version, `ctxr --version` equals CTXR_VERSION, the WebUI compileall) gate every PR.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The provisioner guards live store content, and its refresh path has now failed twice by
  # doing nothing visible. Runs before the image build because it needs no image -- only git,
  # root, and a few seconds -- so a broken refresh is reported in under a minute rather than
  # after a 45-minute matrix.
  provision:
    name: provision refresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Root and a foreign-owned checkout are the point of the test, not an accident of the
      # environment: the production failure only appears when the store belongs to another uid.
      - name: Run the refresh regression tests
        run: sudo sh lib/tests/provision-refresh-test.sh

  # Same reasoning as the job above, for the other pair of guards that fail silently: an
  # allowlist that stopped ignoring a credential, and an archive verifier that stopped noticing
  # a `hermes backup` with no state.db in it. Both produce a green run and a broken backup.
  backup-guards:
    name: backup guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Root against a foreign-owned repo is the production shape, not an accident of the
      # environment -- the same condition that has broken the provisioner's refresh twice.
      - name: Run the backup guard regression tests
        run: sudo sh lib/tests/harness-config-test.sh

      # No root and no image: it only needs sh and a few seconds, so it rides the same job
      # rather than paying for another runner.
      - name: Run the scheduler regression tests
        run: sh lib/tests/schedule-test.sh

      # No root and no image either: real git repositories with a bare origin, and stubbed
      # ctxr/gh. Guards the start-of-container store update, whose failures are all silent --
      # above all, a squash-merged branch mistaken for an unmerged one.
      - name: Run the store-update regression tests
        run: sh lib/tests/update-store-test.sh

      # Same footing: sh and a temp directory. Guards the copy of a store's ctxr-circleback runner
      # into Hermes's scripts directory, and its removal when the store stops shipping it.
      - name: Run the circleback-script install tests
        run: sh lib/tests/install-circleback-script-test.sh

  # The shared compose file stores include remotely. Needs only the runner's Docker Compose:
  # version parity with CTXR_VERSION, portability, and a store's include + override merge.
  compose:
    name: shared compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the shared compose file
        run: python3 -B lib/tests/compose-test.py

  remote-runtime:
    name: remote runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test opt-in configuration and shutdown
        run: python3 lib/tests/harness-remote-test.py

  # harness-install against fake recipes in a temp directory: selection, pins, rollback, pruning,
  # the rendered supervisor config. Only python3, so it reports in seconds.
  harness-install:
    name: harness-install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test harness-install
        run: python3 -B lib/tests/harness-install-test.py
      # The in-place move of a Hermes-image volume into a runtime home, and its reverse.
      - name: Test harness-migrate-home
        run: python3 -B lib/tests/migrate-home-test.py
      # Which `hermes backup` exits the Hermes recipe's snapshot accepts.
      - name: Test the Hermes snapshot
        run: python3 -B lib/tests/hermes-snapshot-test.py

  # The runtime image (docs/design/harnesses-in-home.md, phase 1). Built and tested, never pushed:
  # release.yml does not publish it until the stores move to it.
  runtime:
    name: build (runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve CTXR_VERSION
        id: ctxr
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < CTXR_VERSION)"
          [ -n "${version}" ] || { echo "::error::CTXR_VERSION is empty"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: runtime/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: contexture-runtime:ci
          build-args: |
            CTXR_VERSION=${{ steps.ctxr.outputs.version }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      # No network: fake harnesses under the real recipes' services.
      - name: Test supervision
        run: python3 lib/tests/runtime-container-test.py contexture-runtime:ci

      # The network: every real recipe, from its publisher, into an empty volume.
      - name: Test installing the real harnesses
        run: sh lib/tests/runtime-install-test.sh contexture-runtime:ci

      # Hermes and its WebUI from upstream: boot, exit-75 relaunch, a profile's gateway, an
      # update from one release behind, the forward-only refusal, backup and restore, and what
      # the config repository would track.
      - name: Test Hermes on the runtime image
        run: python3 lib/tests/runtime-hermes-test.py contexture-runtime:ci

  build:
    name: build (${{ matrix.harness }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One entry today. Adding a harness is adding a directory plus a line here; nothing
        # else in this workflow changes.
        harness: [hermes]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve CTXR_VERSION
        id: ctxr
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < CTXR_VERSION)"
          [ -n "${version}" ] || { echo "::error::CTXR_VERSION is empty"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # amd64 only on PRs. The arm64 leg needs QEMU emulation and roughly triples the build,
      # for a Dockerfile whose failure modes (a moved .deb, a version mismatch, a Python
      # syntax break) are not architecture-specific. release.yml still publishes both.
      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: harnesses/${{ matrix.harness }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: contexture-hermes:ci
          build-args: |
            CTXR_VERSION=${{ steps.ctxr.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test remote services under s6-overlay
        run: python3 lib/tests/harness-remote-container-test.py contexture-hermes:ci
