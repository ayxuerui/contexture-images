# Build and push contexture-runtime to GHCR.
#
# The image carries no harness and no ctxr -- stores install them into their homes -- so it has a
# version of its own, the RUNTIME_VERSION file, and the tag is that version. The shared compose
# file names the same version, and CI asserts the two agree.
name: Release

# Publishing is driven by a push to main, not by a tag.
#
# Merging is a USER push, which triggers workflows normally -- so the merge is what publishes, with
# no manual tagging step. The tag is created afterwards, as a record of what shipped, rather than
# being the thing that causes it.
#
# It has to work this way round. A tag pushed by a workflow using GITHUB_TOKEN does NOT trigger
# other workflows (GitHub blocks that to prevent recursion; workflow_dispatch and
# repository_dispatch are the only exceptions), so "workflow creates tag -> release fires on the
# tag" would silently do nothing at all.
on:
  push:
    branches: [main]
    # Anything that changes what lands IN the image, not just its version: a newer base, a recipe
    # or a script change republishes the same tag, which stores pull on their next `up`.
    paths:
      - 'RUNTIME_VERSION'
      - 'runtime/**'
      - 'lib/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish (runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve RUNTIME_VERSION
        id: image
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < RUNTIME_VERSION)"
          [ -n "${version}" ] || { echo "::error::RUNTIME_VERSION is empty" >&2; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/contexture-runtime
          tags: |
            type=raw,value=${{ steps.image.outputs.version }}
            type=raw,value=${{ steps.image.outputs.version }}-${{ github.sha }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=contexture-runtime
            org.opencontainers.image.description=The Contexture platform; every harness and tool installs into the home (runtime ${{ steps.image.outputs.version }})
            org.opencontainers.image.licenses=MIT

      # arm64 matters here: the deployments consuming this run on aarch64. amd64 is carried so
      # the published image is useful off that host.
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A separate job, so the tag is written only once the image published. Not a trigger -- see the
  # note on `on:` above. This records what shipped; it never gates a publish.
  tag:
    name: tag the published version
    needs: publish
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag
        run: |
          set -euo pipefail
          tag="runtime-v$(tr -d '[:space:]' < RUNTIME_VERSION)"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} already exists - leaving it alone"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "${tag}" -m "contexture-runtime ${tag}"
          git push origin "${tag}"
          echo "tagged ${tag}"
