# Keep every pinned agent CLI in harnesses/hermes/Dockerfile current with its publisher.
#
# Same problem watch-ctxr.yml solves for ctxr-cli: nothing here automatically knows that a tool
# published a new version, so a pin drifts silently until someone notices by hand. And since
# this base's install tree is immutable at runtime -- upstream's documented upgrade path is
# "pull the new image and recreate" -- a pin that does not move means a tool that never upgrades.
#
# Two kinds of source:
#   npm      codex, agent-browser -- `npm view <package> version`.
#   release  claude, agy -- neither is on npm, so each is read from the endpoint its own
#            installer reads. claude's `stable` channel file is a bare version; agy's platform
#            manifest is JSON with a `version` key (linux_amd64 is the one CI builds, and both
#            arches publish together). See install-agent-clis.sh for why claude's pin is exact and
#            agy's is a cache key plus an expectation.
#
# It only opens a PR, same contract as watch-ctxr.yml: merging is the deliberate act that
# publishes, via release.yml's push-to-main path filter on harnesses/**.
#
# The PR branch is named by TOOL, not by target version (chore/bump-codex, not
# chore/codex-0.159.2). A version-suffixed name made every new publish open a brand-new PR
# instead of touching the last one, because the branch from the previous run no longer matched
# the one this run wanted to create -- codex alone opened three overlapping, un-superseding bump
# PRs (#30, #34, #35) in the week nothing merged. peter-evans/create-pull-request already updates
# an existing open PR in place when it pushes to a branch name it recognizes (new commit, new
# title, new body); a stable name is what lets it recognize one.
name: Watch agent CLIs

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check for a newer ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: codex
            package: '@openai/codex'
            arg: CODEX_VERSION
          - name: agent-browser
            package: agent-browser
            arg: AGENT_BROWSER_VERSION
          - name: claude
            source_url: https://downloads.claude.ai/claude-code-releases/stable
            arg: CLAUDE_VERSION
          - name: agy
            source_url: https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_amd64.json
            json_key: version
            arg: AGY_VERSION
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Compare pinned against published
        id: compare
        env:
          PACKAGE: ${{ matrix.package }}
          SOURCE_URL: ${{ matrix.source_url }}
          JSON_KEY: ${{ matrix.json_key }}
          ARG_NAME: ${{ matrix.arg }}
        run: |
          set -euo pipefail
          dockerfile=harnesses/hermes/Dockerfile
          pinned="$(sed -n "s/^ARG ${ARG_NAME}=//p" "$dockerfile")"
          if [ -n "${PACKAGE}" ]; then
            latest="$(npm view "${PACKAGE}" version)"
          elif [ -n "${JSON_KEY}" ]; then
            latest="$(curl -fsSL "${SOURCE_URL}" | jq -r --arg k "${JSON_KEY}" '.[$k] // empty')"
          else
            latest="$(curl -fsSL "${SOURCE_URL}" | tr -d '[:space:]')"
          fi
          # Anything but a plain version is refused rather than written into the Dockerfile:
          # an error page or a changed format must fail this run, not land in a bump PR.
          if ! printf '%s\n' "${latest}" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::published version '${latest:0:80}' is not a version; refusing to guess"
            exit 1
          fi
          echo "pinned:    ${pinned}"
          echo "published: ${latest}"
          if [ -z "${pinned}" ]; then
            echo "::error::could not find 'ARG ${ARG_NAME}=' in ${dockerfile}"
            exit 1
          fi
          echo "pinned=${pinned}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          if [ "${pinned}" = "${latest}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump the pin
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          sed -i "s/^ARG ${{ matrix.arg }}=.*/ARG ${{ matrix.arg }}=${{ steps.compare.outputs.latest }}/" harnesses/hermes/Dockerfile

      - name: Open a bump PR
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/bump-${{ matrix.name }}
          base: main
          title: 'Bump ${{ matrix.name }} to ${{ steps.compare.outputs.latest }}'
          commit-message: 'Bump ${{ matrix.name }} to ${{ steps.compare.outputs.latest }}'
          delete-branch: true
          body: |
            **${{ matrix.name }}** published **${{ steps.compare.outputs.latest }}**; this repo
            pins **${{ steps.compare.outputs.pinned }}** (`${{ matrix.arg }}`).

            CI builds this branch, and `install-agent-clis.sh`'s own smoke test confirms the new
            version installs and runs in the image -- an exact match for codex, agent-browser and
            claude; for agy, whose installer cannot be pinned, a warning in the build log if what
            landed differs.

            **Merging is what publishes** -- release.yml triggers on a push to main touching
            `harnesses/**`, so merging this builds and pushes every harness image. Deployments
            pick it up the way upstream documents for this base: pull the new image and recreate.
