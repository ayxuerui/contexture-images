# Keep CODEX_VERSION, AGENT_BROWSER_VERSION and CLAUDE_VERSION current with upstream.
#
# Same problem watch-ctxr.yml solves for ctxr-cli, for the other pinned agent CLIs in
# harnesses/hermes/Dockerfile: nothing here automatically knows that @openai/codex,
# agent-browser or claude published a new version, so a pin drifts silently until someone
# notices by hand.
#
# It only opens a PR, same contract as watch-ctxr.yml: merging is the deliberate act that
# publishes, via release.yml's push-to-main path filter on harnesses/**.
#
# Two jobs, not three matrix legs, because "what's newest" is answered two different ways:
# codex and agent-browser are `npm view <pkg> version`; claude has no npm package, but does
# have its own plain-text version endpoint (see check-claude below) that answers the same
# question. agy gets neither -- its installer takes no version argument at all, and its
# manifest exposes only whatever build is current right now, so there is nothing to compare
# a pin against. It rides along on whichever of these three moves next: all four install in
# the SAME RUN in install-agent-clis.sh, so a bump PR from either job here forces that whole
# layer, agy included, to reinstall fresh instead of replaying a cached one.
name: Watch agent CLIs

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-npm:
    name: check for a newer ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: codex
            package: '@openai/codex'
            arg: CODEX_VERSION
          - name: agent-browser
            package: agent-browser
            arg: AGENT_BROWSER_VERSION
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Compare pinned against published
        id: compare
        env:
          PACKAGE: ${{ matrix.package }}
          ARG_NAME: ${{ matrix.arg }}
        run: |
          set -euo pipefail
          dockerfile=harnesses/hermes/Dockerfile
          pinned="$(sed -n "s/^ARG ${ARG_NAME}=//p" "$dockerfile")"
          latest="$(npm view "${PACKAGE}" version)"
          echo "pinned:    ${pinned}"
          echo "published: ${latest}"
          if [ -z "${pinned}" ]; then
            echo "::error::could not find 'ARG ${ARG_NAME}=' in ${dockerfile}"
            exit 1
          fi
          if [ -z "${latest}" ]; then
            echo "::error::npm view returned nothing; refusing to guess"
            exit 1
          fi
          echo "pinned=${pinned}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          if [ "${pinned}" = "${latest}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump the pin
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          sed -i "s/^ARG ${{ matrix.arg }}=.*/ARG ${{ matrix.arg }}=${{ steps.compare.outputs.latest }}/" harnesses/hermes/Dockerfile

      - name: Open a bump PR
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/${{ matrix.name }}-${{ steps.compare.outputs.latest }}
          base: main
          title: 'Bump ${{ matrix.name }} to ${{ steps.compare.outputs.latest }}'
          commit-message: 'Bump ${{ matrix.name }} to ${{ steps.compare.outputs.latest }}'
          delete-branch: true
          body: |
            `${{ matrix.package }}` published **${{ steps.compare.outputs.latest }}**; this repo
            pins **${{ steps.compare.outputs.pinned }}**.

            CI builds this branch, and `install-agent-clis.sh`'s own smoke test confirms this
            version installs and lands on PATH -- so a green check here means it works in the
            image, not just on the registry.

            This also refreshes `agy`, which has no version of its own to pin -- its installer
            takes no version argument, and its manifest only ever serves whatever's current. It
            installs in the same layer as codex, agent-browser and claude, so bumping any ARG
            here forces that whole layer to run fresh instead of replaying a cached one.

            **Merging is what publishes** -- release.yml triggers on a push to main touching
            `harnesses/**`, so merging this builds and pushes every harness image. There is no
            separate tagging step to remember.

  check-claude:
    name: check for a newer claude
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare pinned against published
        id: compare
        run: |
          set -euo pipefail
          dockerfile=harnesses/hermes/Dockerfile
          pinned="$(sed -n 's/^ARG CLAUDE_VERSION=//p' "$dockerfile")"
          # A plain-text version-per-channel endpoint: .../claude-code-releases/<channel>
          # returns that channel's current version and nothing else. install.sh's own
          # bootstrap step reads the same base path for /latest to fetch its own up-to-date
          # installer (see that script's comment); /stable is the same shape, confirmed by
          # curling both directly -- they return different values (2.1.285 vs 2.1.280 as of
          # 2026-09-30), which is exactly the stable-vs-latest split the `stable` argument to
          # install.sh resolves at install time.
          latest="$(curl -fsSL https://downloads.claude.ai/claude-code-releases/stable)"
          echo "pinned:    ${pinned}"
          echo "published: ${latest}"
          if [ -z "${pinned}" ]; then
            echo "::error::could not find 'ARG CLAUDE_VERSION=' in ${dockerfile}"
            exit 1
          fi
          if ! printf '%s' "${latest}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::stable endpoint returned '${latest}', which is not a version; refusing to guess"
            exit 1
          fi
          echo "pinned=${pinned}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          if [ "${pinned}" = "${latest}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump the pin
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          sed -i "s/^ARG CLAUDE_VERSION=.*/ARG CLAUDE_VERSION=${{ steps.compare.outputs.latest }}/" harnesses/hermes/Dockerfile

      - name: Open a bump PR
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/claude-${{ steps.compare.outputs.latest }}
          base: main
          title: 'Bump claude to ${{ steps.compare.outputs.latest }}'
          commit-message: 'Bump claude to ${{ steps.compare.outputs.latest }}'
          delete-branch: true
          body: |
            The `stable` channel at `downloads.claude.ai/claude-code-releases/stable` now
            resolves to **${{ steps.compare.outputs.latest }}**; this repo pins
            **${{ steps.compare.outputs.pinned }}**.

            CI builds this branch, and `install-agent-clis.sh`'s own smoke test asserts
            `claude --version` equals the new pin exactly -- so a green check here means this
            version actually installs, not just that the endpoint reports it.

            This also refreshes `agy`, which has no version of its own to pin -- its installer
            takes no version argument, and its manifest only ever serves whatever's current. It
            installs in the same layer as claude, codex and agent-browser, so bumping any ARG
            here forces that whole layer to run fresh instead of replaying a cached one.

            **Merging is what publishes** -- release.yml triggers on a push to main touching
            `harnesses/**`, so merging this builds and pushes every harness image. There is no
            separate tagging step to remember.
