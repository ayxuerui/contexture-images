# Shared deployment for a Contexture store on the contexture-runtime image.
#
# The successor to harnesses/hermes/compose.yaml (docs/design/harnesses-in-home.md). A store moves
# by changing its include from that file to this one -- after harness-migrate-home has turned its
# volume into a home -- so stores migrate one at a time, and the old file stays as it is for the
# ones that have not:
#
#   name: my-store
#   include:
#     - https://github.com/ayxuerui/contexture-images.git#main:runtime/compose.yaml
#
# Same contract as the old file: no pin on the store side; the image is named by its ctxr version,
# asserted equal to CTXR_VERSION by CI and bumped with it by watch-ctxr.yml; every service pulls on
# every `up`; nothing here is deployment-specific. What changes for a store:
#
#   - the volume key `data` (HERMES_HOME at /opt/data) is now `home` (the agent's home at
#     /home/agent). A store that maps its volume by name renames the key and keeps the name; a
#     store that never mapped it MUST add `home: {name: <project>_data, external: true}`, or
#     Compose creates an empty <project>_home and the agent boots with no logins.
#   - a second volume, `harnesses`, holds the installed harnesses. It is a cache: never backed up,
#     safe to drop (`docker volume rm <project>_harnesses`) for a clean reinstall.
#   - which harnesses and services run is HARNESSES / HARNESS_SERVICES / HARNESS_PINS, below,
#     replacing HERMES_DASHBOARD, HERMES_WEBUI_ENABLED and HARNESS_REMOTE_AGENTS.

x-image: &image ghcr.io/ayxuerui/contexture-runtime:0.33.0

# What a container has. Defaulted here, so a harness added to the default reaches every store on
# merge; a store's .env or override changes only what it wants different. The backup jobs read
# them too: harness-backup and harness-config-push work from the selected harnesses' recipes.
x-harness-selection: &harness-selection
  HARNESSES: ${HARNESSES:-hermes,hermes-webui,claude,codex,agy,agent-browser,cb}
  HARNESS_SERVICES: ${HARNESS_SERVICES:-hermes-gateway,hermes-dashboard,hermes-webui}
  HARNESS_PINS: ${HARNESS_PINS:-}

# The one-shots and schedulers override the entrypoint, so the runtime entrypoint never runs:
# HOME is set explicitly rather than taken from the remapped passwd entry.
x-harness-home: &harness-home
  <<: *harness-selection
  HOME: /home/agent

# Every value uses `:-`, never `:?`, for the reason the old file gives: Compose interpolates the
# whole model on every command, so a `:?` on a profile-gated service would break `up` for a store
# without backups.
x-backup-env: &backup-env
  <<: *harness-home
  HARNESS_BACKUP_DESTINATION: ${HARNESS_BACKUP_DESTINATION:-}
  HARNESS_BACKUP_PASSWORD_FILE: ${HARNESS_BACKUP_PASSWORD_FILE:-/home/agent/.config/contexture/restic-password}
  HARNESS_BACKUP_KEEP: ${HARNESS_BACKUP_KEEP:---keep-daily 7 --keep-weekly 8 --keep-monthly 6}
  HARNESS_BACKUP_MIN_FREE_MB: ${HARNESS_BACKUP_MIN_FREE_MB:-2048}
  RESTIC_PACK_SIZE: ${RESTIC_PACK_SIZE:-64}
  RCLONE_CONFIG_GDRIVE_TYPE: drive
  RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${RCLONE_CONFIG_GDRIVE_CLIENT_ID:-}
  RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${RCLONE_CONFIG_GDRIVE_CLIENT_SECRET:-}
  RCLONE_CONFIG_GDRIVE_SCOPE: ${RCLONE_CONFIG_GDRIVE_SCOPE:-drive.file}
  RCLONE_CONFIG_GDRIVE_TOKEN: ${RCLONE_CONFIG_GDRIVE_TOKEN:-}

# The store's recording identity, when it is a GitHub App. Given ONLY to `serve`, never to
# `agents`: the agent runs shell commands, and an agent that could use the App's key could approve
# its own change.
x-approval-env: &approval-env
  CONTEXTURE_GITHUB_APP_ID: ${CONTEXTURE_GITHUB_APP_ID:-}
  CONTEXTURE_GITHUB_APP_PRIVATE_KEY_FILE: ${CONTEXTURE_GITHUB_APP_ID:+/run/secrets/github-app-key}

x-config-env: &config-env
  <<: *harness-home
  HARNESS_CONFIG_REPO: ${HARNESS_CONFIG_REPO:-}

services:
  # One-off provisioning: clone the store into the store volume and persist the gh credential in
  # the agent's home.
  #   docker compose --profile init run --rm workspace-init
  workspace-init:
    image: *image
    pull_policy: always
    profiles: ["init"]
    restart: "no"
    entrypoint: ["ctxr-provision"]
    environment:
      REPO_URL: ${REPO_URL:-}
      GH_TOKEN: ${GH_TOKEN:-}
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      CONTEXTURE_STORE_ROOT: /store
      HARNESS_AGENT_HOME: /home/agent
      PUID: ${PUID:-10000}
      PGID: ${PGID:-10000}
    volumes:
      - store:/store
      - home:/home/agent

  # Every selected harness and its services, under supervisord as `agent`. The image's entrypoint
  # remaps PUID/PGID, installs what is missing into the harnesses volume and starts the
  # supervisor; never override it.
  agents:
    image: *image
    pull_policy: always
    restart: unless-stopped
    # harness-remote gives a remote session 8 s to exit, and every program stops at once.
    stop_grace_period: 30s
    # Required by the Chromium the browser tools run.
    shm_size: "1gb"
    environment:
      <<: *harness-selection
      CONTEXTURE_STORE_ROOT: /store
      PUID: ${PUID:-10000}
      PGID: ${PGID:-10000}
      # The daily harness update, in seconds; 0 turns it off.
      HARNESS_UPDATE_INTERVAL: ${HARNESS_UPDATE_INTERVAL:-86400}
      CTXR_UPDATE_STORE_ENABLED: ${CTXR_UPDATE_STORE_ENABLED:-1}
      # The store's skills, for Hermes. `$$` keeps the variable for Hermes to expand.
      HERMES_SKILLS_EXTERNAL_DIRS: '["$$CONTEXTURE_STORE_ROOT/.agents/skills"]'
      # Hermes' gateway API server, as in the old file: the WebUI's health pill and cron fires use
      # it. Every SECONDARY profile must pin `platforms.api_server.enabled: false`.
      API_SERVER_ENABLED: "1"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${API_SERVER_KEY:?API_SERVER_KEY is required}
      # Dashboard auth lives in ~/.hermes/config.yaml (dashboard.basic_auth.*); the dashboard
      # refuses a non-loopback bind without it, and the healthcheck catches that.
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      # The WebUI runs the agent in-process; HERMES_WEBUI_CHAT_BACKEND stays unset.
      HERMES_WEBUI_HOST: "0.0.0.0"
      HERMES_WEBUI_PORT: "8787"
      HERMES_WEBUI_DEFAULT_WORKSPACE: /store
      HERMES_API_URL: http://127.0.0.1:8642
      HERMES_WEBUI_PASSWORD: ${HERMES_WEBUI_PASSWORD:-}
      HERMES_WEBUI_ALLOWED_ORIGINS: ${HERMES_WEBUI_ALLOWED_ORIGINS:?HERMES_WEBUI_ALLOWED_ORIGINS is required}
      # Arguments for remote sessions selected in HARNESS_SERVICES (claude-remote, ...).
      HARNESS_REMOTE_CLAUDE_ARGS: ${HARNESS_REMOTE_CLAUDE_ARGS:-}
      HARNESS_REMOTE_CODEX_ARGS: ${HARNESS_REMOTE_CODEX_ARGS:-}
      HARNESS_REMOTE_AGY_ARGS: ${HARNESS_REMOTE_AGY_ARGS:-}
    volumes:
      - home:/home/agent
      - harnesses:/opt/harnesses
      - store:/store
    healthcheck:
      # Provisioning ran; the store's skills directory exists where HERMES_SKILLS_EXTERNAL_DIRS
      # points; every selected harness is installed and every selected program is running and,
      # where its recipe names a probe, answering HTTP (`harness-install status`).
      test: ["CMD-SHELL", "test -f /store/.contexture-initialized && test -d \"$$CONTEXTURE_STORE_ROOT/.agents/skills\" && harness-install status"]
      interval: 30s
      timeout: 15s
      # A first boot installs every harness (Hermes alone takes minutes); later boots install
      # nothing. A check that passes inside the start period still reports healthy at once.
      start_period: 15m
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${AGENTS_MEMORY_LIMIT:-6G}
          cpus: "${AGENTS_CPUS:-3.0}"

  # Browsing, the approval page, and landing what was approved. Unchanged from the old file but for
  # the image: its own container, because it holds the App key and agents must not, and it mounts
  # neither the home nor the harnesses.
  serve:
    image: *image
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["ctxr"]
    command: ["serve", "--host", "0.0.0.0", "--port", "${CTXR_SERVE_PORT:-18080}", "--root", "/store"]
    user: "${PUID:-10000}:${PGID:-10000}"
    environment:
      <<: *approval-env
    secrets:
      - github-app-key
    volumes:
      - store:/store
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://127.0.0.1:${CTXR_SERVE_PORT:-18080}/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # --- Harness home backup ------------------------------------------------------------------
  # harness-backup: the whole home to restic, credentials included, each harness's state through
  # its recipe's snapshot (Hermes': `hermes backup`). harness-config-push: the selected recipes'
  # config to a private git repository, no credentials. Restore, with the agents stopped:
  #
  #   docker compose stop agents
  #   docker compose --profile backup run --rm harness-backup restore [SNAPSHOT]
  #
  # The harnesses volume is mounted read-only: the recipes' snapshot commands run the installed
  # harnesses (`hermes backup`), and nothing here installs them.
  harness-backup:
    image: *image
    pull_policy: always
    profiles: ["backup"]
    restart: "no"
    entrypoint: ["harness-backup"]
    user: "${PUID:-10000}:${PGID:-10000}"
    environment:
      <<: *backup-env
    volumes:
      - home:/home/agent
      - harnesses:/opt/harnesses:ro

  harness-config-push:
    image: *image
    pull_policy: always
    profiles: ["backup"]
    restart: "no"
    entrypoint: ["harness-config-push"]
    user: "${PUID:-10000}:${PGID:-10000}"
    environment:
      <<: *config-env
      HARNESS_CONFIG_DRY_RUN: ${HARNESS_CONFIG_DRY_RUN:-}
    volumes:
      - home:/home/agent
      - harnesses:/opt/harnesses:ro

  # Turns a Hermes-image `data` volume into a home, in place; --reverse puts it back. With the
  # agents stopped:  docker compose --profile migrate run --rm harness-migrate-home --agents-stopped
  harness-migrate-home:
    image: *image
    pull_policy: always
    profiles: ["migrate"]
    restart: "no"
    entrypoint: ["harness-migrate-home"]
    user: "${PUID:-10000}:${PGID:-10000}"
    volumes:
      - home:/home/agent

  harness-backup-cron:
    image: *image
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["harness-schedule"]
    command: ["harness-backup"]
    user: "${PUID:-10000}:${PGID:-10000}"
    environment:
      <<: *backup-env
      HARNESS_SCHEDULE_INTERVAL: ${HARNESS_BACKUP_INTERVAL:-86400}
      HARNESS_SCHEDULE_NAME: harness-backup
      # Failures go out through `hermes send`, from the installed Hermes, when a target is set.
      HARNESS_SCHEDULE_NOTIFY: ${HARNESS_NOTIFY_TARGET:-}
    volumes:
      - home:/home/agent
      - harnesses:/opt/harnesses:ro
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  harness-config-cron:
    image: *image
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["harness-schedule"]
    command: ["harness-config-push"]
    user: "${PUID:-10000}:${PGID:-10000}"
    environment:
      <<: *config-env
      HARNESS_SCHEDULE_INTERVAL: ${HARNESS_CONFIG_INTERVAL:-21600}
      HARNESS_SCHEDULE_NAME: harness-config-push
      HARNESS_SCHEDULE_NOTIFY: ${HARNESS_NOTIFY_TARGET:-}
    volumes:
      - home:/home/agent
      - harnesses:/opt/harnesses:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

secrets:
  github-app-key:
    file: ${CONTEXTURE_GITHUB_APP_PRIVATE_KEY_PATH:-/dev/null}

volumes:
  # The agent's home: every harness's state and every provider login. NEVER `docker compose down
  # -v`: only interactive re-authentication recovers what this holds.
  home:
  # The installed harnesses: a cache, rebuilt from the recipes when dropped.
  harnesses:
  # The store checkout the agents work in.
  store:
