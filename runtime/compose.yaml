# Shared deployment for a Contexture store on the contexture-runtime image.
#
# Every store includes it from main (docs/design/harnesses-in-home.md):
#
#   name: my-store
#   include:
#     - https://github.com/ayxuerui/contexture-images.git#main:runtime/compose.yaml
#
# No pin on the store side: the image is named by its own version, asserted equal to RUNTIME_VERSION
# by CI; every service pulls on every `up`; nothing here is deployment-specific. The image carries
# no ctxr: it is installed into a home on first boot and updated daily, like every tool. What
# changed for a store coming from the retired contexture-hermes stack:
#
#   - the volume key `data` (HERMES_HOME at /opt/data) is now `home` (the agent's home at
#     /home/agent). A store that maps its volume by name renames the key and keeps the name; a
#     store that never mapped it MUST add `home: {name: <project>_data, external: true}`, or
#     Compose creates an empty <project>_home and the agent boots with no logins.
#   - every harness and tool is installed into that home by its publisher's own installer (npm
#     packages with `npm install -g` into ~/.local), and backed up with it. There is no second
#     volume; a store that still has `<project>_harnesses` from an earlier image can remove it.
#   - which harnesses, tools and services run is HARNESSES / TOOLS / HARNESS_SERVICES, below,
#     replacing HERMES_DASHBOARD, HERMES_WEBUI_ENABLED and HARNESS_REMOTE_AGENTS.
#   - the backup variables are HOME_BACKUP_* and HOME_CONFIG_*; the HARNESS_BACKUP_* and
#     HARNESS_CONFIG_* names they replace are still read when the new ones are unset.

x-image: &image ghcr.io/ayxuerui/contexture-runtime:1.0.0

# What a container has: the harnesses (the agents), the tools they use, and the harnesses'
# programs to run. Defaulted here, so one added to the default reaches every store on merge; a
# store's .env or override changes only what it wants different. The backup jobs read them too:
# home-backup and home-config-push work from the selected recipes.
x-runtime-selection: &runtime-selection
  HARNESSES: ${HARNESSES:-hermes,hermes-webui,claude,codex,agy}
  TOOLS: ${TOOLS:-ctxr,cb,agent-browser}
  HARNESS_SERVICES: ${HARNESS_SERVICES:-hermes-gateway,hermes-dashboard,hermes-webui}

# The one-shots and schedulers override the entrypoint, so the runtime entrypoint never runs:
# HOME is set explicitly rather than taken from the remapped passwd entry.
x-runtime-home: &runtime-home
  <<: *runtime-selection
  HOME: /home/agent

# Every value uses `:-`, never `:?`, for the reason the old file gives: Compose interpolates the
# whole model on every command, so a `:?` on a profile-gated service would break `up` for a store
# without backups.
x-backup-env: &backup-env
  <<: *runtime-home
  HOME_BACKUP_DESTINATION: ${HOME_BACKUP_DESTINATION:-${HARNESS_BACKUP_DESTINATION:-}}
  HOME_BACKUP_PASSWORD_FILE: ${HOME_BACKUP_PASSWORD_FILE:-${HARNESS_BACKUP_PASSWORD_FILE:-/home/agent/.config/contexture/restic-password}}
  HOME_BACKUP_KEEP: ${HOME_BACKUP_KEEP:-${HARNESS_BACKUP_KEEP:---keep-daily 7 --keep-weekly 8 --keep-monthly 6}}
  HOME_BACKUP_MIN_FREE_MB: ${HOME_BACKUP_MIN_FREE_MB:-${HARNESS_BACKUP_MIN_FREE_MB:-2048}}
  RESTIC_PACK_SIZE: ${RESTIC_PACK_SIZE:-64}
  RCLONE_CONFIG_GDRIVE_TYPE: drive
  RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${RCLONE_CONFIG_GDRIVE_CLIENT_ID:-}
  RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${RCLONE_CONFIG_GDRIVE_CLIENT_SECRET:-}
  RCLONE_CONFIG_GDRIVE_SCOPE: ${RCLONE_CONFIG_GDRIVE_SCOPE:-drive.file}
  RCLONE_CONFIG_GDRIVE_TOKEN: ${RCLONE_CONFIG_GDRIVE_TOKEN:-}

# The store's recording identity, when it is a GitHub App. Given ONLY to `serve`, never to
# `agents`: the agent runs shell commands, and an agent that could use the App's key could approve
# its own change.
x-approval-env: &approval-env
  CONTEXTURE_GITHUB_APP_ID: ${CONTEXTURE_GITHUB_APP_ID:-}
  CONTEXTURE_GITHUB_APP_PRIVATE_KEY_FILE: ${CONTEXTURE_GITHUB_APP_ID:+/run/secrets/github-app-key}

x-config-env: &config-env
  <<: *runtime-home
  HOME_CONFIG_REPO: ${HOME_CONFIG_REPO:-${HARNESS_CONFIG_REPO:-}}
  # A store's own keeps and ignores, whitespace-separated, home-relative (`.hermes/plugins/x/`).
  HOME_CONFIG_INCLUDE: ${HOME_CONFIG_INCLUDE:-${HARNESS_CONFIG_INCLUDE:-}}
  HOME_CONFIG_EXCLUDE: ${HOME_CONFIG_EXCLUDE:-${HARNESS_CONFIG_EXCLUDE:-}}

services:
  # One-off provisioning: install ctxr into the agent's home, clone the store into the store volume
  # and persist the gh credential in the home.
  #   docker compose --profile init run --rm workspace-init
  workspace-init:
    image: *image
    pull_policy: always
    profiles: ["init"]
    restart: "no"
    entrypoint: ["runtime-provision"]
    environment:
      REPO_URL: ${REPO_URL:-}
      GH_TOKEN: ${GH_TOKEN:-}
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      CONTEXTURE_STORE_ROOT: /store
      HARNESS_AGENT_HOME: /home/agent
      PUID: ${PUID:-10000}
      PGID: ${PGID:-10000}
    volumes:
      - store:/store
      - home:/home/agent

  # Every selected harness and tool, and the harnesses' services, under supervisord as `agent`. The
  # image's entrypoint remaps PUID/PGID, installs what is missing into the home and starts the
  # supervisor; never override it.
  agents:
    image: *image
    pull_policy: always
    restart: unless-stopped
    # harness-remote gives a remote session 8 s to exit, and every program stops at once.
    stop_grace_period: 30s
    # Required by the Chromium the browser tools run.
    shm_size: "1gb"
    environment:
      <<: *runtime-selection
      CONTEXTURE_STORE_ROOT: /store
      PUID: ${PUID:-10000}
      PGID: ${PGID:-10000}
      # The daily update of what does not update itself, in seconds; 0 turns it off.
      RUNTIME_UPDATE_INTERVAL: ${RUNTIME_UPDATE_INTERVAL:-${HARNESS_UPDATE_INTERVAL:-86400}}
      CTXR_UPDATE_STORE_ENABLED: ${CTXR_UPDATE_STORE_ENABLED:-1}
      # The store's skills, for Hermes. `$$` keeps the variable for Hermes to expand.
      HERMES_SKILLS_EXTERNAL_DIRS: '["$$CONTEXTURE_STORE_ROOT/.agents/skills"]'
      # Hermes' gateway API server, as in the old file: the WebUI's health pill and cron fires use
      # it. Every SECONDARY profile must pin `platforms.api_server.enabled: false`.
      API_SERVER_ENABLED: "1"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${API_SERVER_KEY:?API_SERVER_KEY is required}
      # Dashboard auth lives in ~/.hermes/config.yaml (dashboard.basic_auth.*); the dashboard
      # refuses a non-loopback bind without it, and the healthcheck catches that.
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      # The WebUI runs the agent in-process; HERMES_WEBUI_CHAT_BACKEND stays unset.
      HERMES_WEBUI_HOST: "0.0.0.0"
      HERMES_WEBUI_PORT: "8787"
      HERMES_WEBUI_DEFAULT_WORKSPACE: /store
      HERMES_API_URL: http://127.0.0.1:8642
      HERMES_WEBUI_PASSWORD: ${HERMES_WEBUI_PASSWORD:-}
      HERMES_WEBUI_ALLOWED_ORIGINS: ${HERMES_WEBUI_ALLOWED_ORIGINS:?HERMES_WEBUI_ALLOWED_ORIGINS is required}
      # Arguments for remote sessions selected in HARNESS_SERVICES (claude-remote, ...).
      HARNESS_REMOTE_CLAUDE_ARGS: ${HARNESS_REMOTE_CLAUDE_ARGS:-}
      HARNESS_REMOTE_CODEX_ARGS: ${HARNESS_REMOTE_CODEX_ARGS:-}
      HARNESS_REMOTE_AGY_ARGS: ${HARNESS_REMOTE_AGY_ARGS:-}
    volumes:
      - home:/home/agent
      - store:/store
    healthcheck:
      # Provisioning ran; the store's skills directory exists where HERMES_SKILLS_EXTERNAL_DIRS
      # points; every selected harness and tool is installed and every selected program is running
      # and, where its recipe names a probe, answering HTTP (`runtime-install status`).
      test: ["CMD-SHELL", "test -f /store/.contexture-initialized && test -d \"$$CONTEXTURE_STORE_ROOT/.agents/skills\" && runtime-install status"]
      interval: 30s
      timeout: 15s
      # A first boot installs everything (Hermes alone takes minutes); later boots install
      # nothing. A check that passes inside the start period still reports healthy at once.
      start_period: 15m
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${AGENTS_MEMORY_LIMIT:-6G}
          cpus: "${AGENTS_CPUS:-3.0}"

  # Browsing, the approval page, and landing what was approved. Its own container, because it holds
  # the App key and agents must not, with its own home (`serve-home`) that no agent container
  # mounts: the same image, entrypoint and supervisor as `agents`, selecting only ctxr and its
  # `ctxr-serve` program. ctxr installs there on first boot and updates daily, restarting serve.
  serve:
    image: *image
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *approval-env
      HARNESSES: ""
      TOOLS: ctxr
      HARNESS_SERVICES: ctxr-serve
      CONTEXTURE_STORE_ROOT: /store
      CTXR_SERVE_PORT: ${CTXR_SERVE_PORT:-18080}
      PUID: ${PUID:-10000}
      PGID: ${PGID:-10000}
      RUNTIME_UPDATE_INTERVAL: ${RUNTIME_UPDATE_INTERVAL:-${HARNESS_UPDATE_INTERVAL:-86400}}
      # The store's own changes are the agents' to open; serve only reads and lands.
      CTXR_UPDATE_STORE_ENABLED: "0"
    secrets:
      - github-app-key
    volumes:
      - serve-home:/home/agent
      - store:/store
    healthcheck:
      test: ["CMD-SHELL", "runtime-install status"]
      interval: 30s
      timeout: 15s
      # The first boot installs ctxr.
      start_period: 5m
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # --- Home backup ---------------------------------------------------------------------------
  # home-backup: the whole home to restic -- credentials, installed harnesses and tools included --
  # with live databases through their recipe's snapshot (Hermes': `hermes backup`).
  # home-config-push: the selected recipes' config to a private git repository, no credentials.
  # The service names keep their harness-* names, which stores' overrides refer to. Restore, with
  # the agents stopped:
  #
  #   docker compose stop agents
  #   docker compose --profile backup run --rm harness-backup restore [SNAPSHOT]
  harness-backup:
    image: *image
    pull_policy: always
    profiles: ["backup"]
    restart: "no"
    entrypoint: ["home-backup"]
    user: "${PUID:-10000}:${PGID:-10000}"
    environment:
      <<: *backup-env
    volumes:
      - home:/home/agent

  harness-config-push:
    image: *image
    pull_policy: always
    profiles: ["backup"]
    restart: "no"
    entrypoint: ["home-config-push"]
    user: "${PUID:-10000}:${PGID:-10000}"
    environment:
      <<: *config-env
      HOME_CONFIG_DRY_RUN: ${HOME_CONFIG_DRY_RUN:-${HARNESS_CONFIG_DRY_RUN:-}}
    volumes:
      - home:/home/agent

  # Turns a Hermes-image `data` volume into a home, in place; --reverse puts it back. With the
  # agents stopped:  docker compose --profile migrate run --rm harness-migrate-home --agents-stopped
  # (The service keeps its name; its command is now home-migrate.)
  harness-migrate-home:
    image: *image
    pull_policy: always
    profiles: ["migrate"]
    restart: "no"
    entrypoint: ["home-migrate"]
    user: "${PUID:-10000}:${PGID:-10000}"
    volumes:
      - home:/home/agent

  harness-backup-cron:
    image: *image
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["runtime-schedule"]
    command: ["home-backup"]
    user: "${PUID:-10000}:${PGID:-10000}"
    environment:
      <<: *backup-env
      HARNESS_SCHEDULE_INTERVAL: ${HOME_BACKUP_INTERVAL:-${HARNESS_BACKUP_INTERVAL:-86400}}
      HARNESS_SCHEDULE_NAME: home-backup
      # Failures go out through `hermes send`, from the installed Hermes, when a target is set.
      HARNESS_SCHEDULE_NOTIFY: ${HARNESS_NOTIFY_TARGET:-}
    volumes:
      - home:/home/agent
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  harness-config-cron:
    image: *image
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["runtime-schedule"]
    command: ["home-config-push"]
    user: "${PUID:-10000}:${PGID:-10000}"
    environment:
      <<: *config-env
      HARNESS_SCHEDULE_INTERVAL: ${HOME_CONFIG_INTERVAL:-${HARNESS_CONFIG_INTERVAL:-21600}}
      HARNESS_SCHEDULE_NAME: home-config-push
      HARNESS_SCHEDULE_NOTIFY: ${HARNESS_NOTIFY_TARGET:-}
    volumes:
      - home:/home/agent
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

secrets:
  github-app-key:
    file: ${CONTEXTURE_GITHUB_APP_PRIVATE_KEY_PATH:-/dev/null}

volumes:
  # The agent's home: every harness and tool, their state, and every provider login. NEVER
  # `docker compose down -v`: only interactive re-authentication recovers what this holds.
  home:
  # serve's home: its ctxr and nothing else. Never mounted by an agent container. Safe to drop.
  serve-home:
  # The store checkout the agents work in.
  store:
