; The runtime image's supervisor. supervisord runs as `agent`, never root, and every program it
; starts is generated by harness-install into /run/harness/programs.conf at each boot: one per
; service in HARNESS_SERVICES, plus the platform's own (store-update, harness-update).
;
; Installed over Debian's /etc/supervisor/supervisord.conf so a plain `supervisorctl status`
; (docker exec -u agent <container> supervisorctl status) finds this socket.
[unix_http_server]
file=/run/harness/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
; In the foreground supervisord already prints its notices (FATAL, restarts) to stdout, which is
; the container log; a logfile of /dev/stdout would print each one twice.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/harness/supervisord.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/harness/supervisor.sock

[include]
files = /run/harness/programs.conf
